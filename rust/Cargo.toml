# The Rust side of the library. A plug-in's own crate, in its rust/ folder, depends on these by their path in its
# submodule, and cmake/HadronycheRust.cmake builds that crate into the plug-in.

[workspace]
resolver = "3"
members = ["hadronyche-dsp"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
publish = false
